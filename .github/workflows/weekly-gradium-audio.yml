name: Weekly Gradium Audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.ref == 'refs/heads/codex/vayishlach-gradium-render' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Render the approved narration once
        run: python3 scripts/render_vayishlach_take.py
        env:
          GRADIUM_API_KEY: ${{ secrets.GRADIUM_API_KEY }}
          GRADIUM_VOICE_ID: ${{ vars.GRADIUM_VOICE_ID }}
      - name: Save rendered audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vayishlach-gradium-take
          path: ${{ runner.temp }}/vayishlach-take/
          retention-days: 3
          if-no-files-found: ignore
